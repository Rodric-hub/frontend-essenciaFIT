<!-- src/app/features/productos/productos.component.html -->

<main class="container mt-4">
  <div class="row">

    <!-- FILTROS -->
    <div class="col-md-3">
      <div class="bg-light rounded p-3">
        <h5 class="text-success fw-bold border-bottom border-success pb-2">Categorías</h5>

        <ul class="list-group">

          <li class="list-group-item">
            <a routerLink="/productos" class="text-decoration-none text-dark fw-500">
              Todos
            </a>
          </li>

          <li class="list-group-item" *ngFor="let cat of categorias()">

            <a [routerLink]="['/productos/categoria', cat.id]"
               class="text-decoration-none text-dark">
              {{ cat.nombre }}
            </a>

          </li>

        </ul>

      </div>
    </div>


    <!-- PRODUCTOS -->
    <div class="col-md-9">

      <div class="row g-4">

        <div class="col-md-4 col-sm-6" *ngFor="let producto of productos()">

          <div class="card h-100 shadow-sm"
               [routerLink]="['/productos', producto.id]"
               style="cursor:pointer;">


            <img [src]="producto.imagenUrl"
                 class="card-img-top p-3"
                 [alt]="producto.nombre"
                 style="height:220px;object-fit:contain;background:#f5f5f5;">


            <div class="card-body text-center d-flex flex-column justify-content-between">

              <div>

                <h5 class="card-title">
                  {{ producto.nombre }}
                </h5>

                <p class="text-danger fw-bold">
                  S/ {{ producto.precio }}
                </p>

              </div>


              <div>


                <button *ngIf="auth.isLoggedIn() && producto.stock > 0"
                        class="btn btn-success w-100"
                        (click)="$event.stopPropagation(); agregarAlCarrito(producto.id)">

                  Añadir al carrito

                </button>



                <a *ngIf="!auth.isLoggedIn() && producto.stock > 0"
                   routerLink="/login"
                   class="btn btn-success w-100">

                  Añadir al carrito

                </a>



                <button *ngIf="producto.stock === 0"
                        class="btn btn-secondary w-100"
                        disabled>

                  Agotado

                </button>


              </div>


            </div>


          </div>


        </div>



        <div *ngIf="productos().length === 0"
             class="col-12 text-center text-muted py-5">

          No hay productos en esta categoría.

        </div>


      </div>

    </div>


  </div>
</main>



<app-footer></app-footer>



<!-- Modal Producto Agregado -->

<div class="modal fade"
     id="productoAgregadoModal"
     tabindex="-1"
     aria-hidden="true">


  <div class="modal-dialog modal-dialog-centered">


    <div class="modal-content">


      <div class="modal-header bg-success text-white">


        <h5 class="modal-title">

          Producto agregado

        </h5>



        <button
          type="button"
          class="btn-close btn-close-white"
          (click)="cerrarModal()">

        </button>


      </div>



      <div class="modal-body text-center">


        <h1>✅</h1>


        <p class="mb-0">

          El producto fue agregado correctamente al carrito.

        </p>


      </div>



      <div class="modal-footer">


        <button
          type="button"
          class="btn btn-secondary"
          (click)="cerrarModal()">

          Seguir comprando

        </button>



        <a
          routerLink="/carrito"
          class="btn btn-success">

          Ir al carrito

        </a>


      </div>



    </div>


  </div>


</div>
