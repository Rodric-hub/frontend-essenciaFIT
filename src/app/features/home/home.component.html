<!-- src/app/features/home/home.component.html -->

<!-- Flash message -->
<div *ngIf="msgExito()" class="container mt-2">
  <div class="alert alert-success text-center">{{ msgExito() }}</div>
</div>

<!-- CARRUSEL -->
<!-- PROMO CAROUSEL -->
<section class="promoCarousel">
  <button class="navArrow navLeft" (click)="prevSlide()" aria-label="Anterior">&#8249;</button>

  <div class="slideWrapper" (click)="irAProductos()">
    <img *ngFor="let img of promoImages; let i = index"
         [src]="img"
         [class.active]="i === currentSlide"
         class="slideImg"
         alt="Promoción Essencia Fit">
  </div>

  <button class="navArrow navRight" (click)="nextSlide()" aria-label="Siguiente">&#8250;</button>

  <div class="dots">
    <button *ngFor="let img of promoImages; let i = index"
            class="dot"
            [class.dotActive]="i === currentSlide"
            (click)="goToSlide(i)"
            [attr.aria-label]="'Slide ' + (i + 1)">
    </button>
  </div>
</section>

<!-- PRODUCTOS -->
<section id="productos" class="py-5">
  <div class="container">
    <h2 class="text-center mb-5">Suplementos más Populares</h2>

    <div class="mb-3">
      <a routerLink="/productos" class="text-success fw-bold">➜ Ver todos los productos</a>
    </div>

    <div class="row g-4">
      <div class="col-md-3" *ngFor="let producto of productos()">
        <div class="card h-100 shadow-sm" [routerLink]="['/productos', producto.id]" style="cursor:pointer;">
          <img [src]="producto.imagenUrl" class="card-img-top" [alt]="producto.nombre"
               style="height:250px;object-fit:cover;">
          <div class="card-body text-center d-flex flex-column justify-content-between">
            <div>
              <h5 class="card-title">{{ producto.nombre }}</h5>
              <p class="text-danger fw-bold">S/ {{ producto.precio }}</p>
            </div>

            <div>
              <!-- Logueado y con stock -->
              <button *ngIf="auth.isLoggedIn() && producto.stock > 0"
                      class="btn btn-success w-100"
                      (click)="agregarAlCarrito(producto.id); $event.stopPropagation()">
                Añadir al carrito
              </button>

              <!-- No logueado -->
              <a *ngIf="!auth.isLoggedIn()"
                 routerLink="/login"
                 class="btn btn-success w-100">
                Añadir al carrito
              </a>

              <!-- Sin stock -->
              <button *ngIf="producto.stock === 0"
                      class="btn btn-secondary w-100" disabled>
                Agotado
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4 mt-auto">
  <div class="container">
    <p class="mb-0">© 2025 - Essencia Fit | Proyecto Universitario UTP</p>
    <p class="small">Villa el Salvador - Lima, Perú</p>
  </div>
</footer>
